$kind: http-request
name: Get Customer Cities
order: 2000
method: GET
url: '{{baseUrl}}/customers/cities'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Response is JSON', () => {
        pm.response.to.be.json;
      });
