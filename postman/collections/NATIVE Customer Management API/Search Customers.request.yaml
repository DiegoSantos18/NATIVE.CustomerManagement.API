$kind: http-request
name: Search Customers
order: 4000
method: POST
url: '{{baseUrl}}/customers/search'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "pagination": {
        "page": 1,
        "pageSize": 10
      },
      "filters": {},
      "sort": {
        "sortBy": "firstName",
        "sortOrder": "asc"
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Response is JSON', () => {
        pm.response.to.be.json;
      });
