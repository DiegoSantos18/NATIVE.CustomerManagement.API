$kind: http-request
name: Health Check
order: 1000
method: GET
url: '{{baseUrl}}/health'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', () => {
        pm.response.to.have.status(200);
      });
      pm.test('API reports OK', () => {
        const body = pm.response.json();
        pm.expect(body.status).to.eql('OK');
      });
