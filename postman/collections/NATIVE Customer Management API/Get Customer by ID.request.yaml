$kind: http-request
name: Get Customer by ID
order: 5000
method: GET
url: '{{baseUrl}}/customers/:id'
pathVariables:
  - key: id
    value: '{{customerId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Response is JSON', () => {
        pm.response.to.be.json;
      });
